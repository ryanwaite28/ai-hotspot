stages:
  - validate
  - test
  - security
  - build
  - deploy

default:
  tags:
    - default
    - generic

include:
  - local: ci/security-gates.gitlab-ci.yml

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

validate:manifests:
  stage: validate
  image: bitnami/kubectl:1.31
  script:
    - test -d k8s
    - kubectl kustomize k8s || true
  rules:
    - if: '$CI_COMMIT_BRANCH'

test:unit:
  stage: test
  image: node:22-alpine
  script:
    - npm ci || npm install
    - npm run test
  rules:
    - if: '$CI_COMMIT_BRANCH'

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  script:
    - ./ci/build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:dev:
  stage: deploy
  image: bitnami/kubectl:1.31
  script:
    - ./ci/deploy.sh dev
  environment:
    name: dev
    url: https://dev.hotspot.rmwhs.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:prod:
  stage: deploy
  image: bitnami/kubectl:1.31
  script:
    - ./ci/deploy.sh prod
  environment:
    name: production
    url: https://hotspot.rmwhs.com
  rules:
    - if: '$CI_COMMIT_TAG'
