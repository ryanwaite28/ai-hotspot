apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotspot-api
  namespace: hotspot-dev
  labels:
    app: hotspot-api
    app.kubernetes.io/name: hotspot-api
    app.kubernetes.io/part-of: hotspot
    observability.openobserve/enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotspot-api
  template:
    metadata:
      labels:
        app: hotspot-api
        app.kubernetes.io/name: hotspot-api
        app.kubernetes.io/part-of: hotspot
        observability.openobserve/enabled: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: hotspot-deployer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: hotspot-api
          image: registry.example.com/hotspot/api:replace-with-ci-sha
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          envFrom:
            - secretRef:
                name: hotspot-app-secrets
            - configMapRef:
                name: hotspot-app-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
