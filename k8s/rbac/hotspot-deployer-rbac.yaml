apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotspot-deployer
  namespace: hotspot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hotspot-deployer-role
  namespace: hotspot
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hotspot-deployer-binding
  namespace: hotspot
subjects:
  - kind: ServiceAccount
    name: hotspot-deployer
    namespace: hotspot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hotspot-deployer-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotspot-deployer
  namespace: hotspot-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
