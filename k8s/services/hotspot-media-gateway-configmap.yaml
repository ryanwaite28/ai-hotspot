apiVersion: v1
kind: ConfigMap
metadata:
  name: hotspot-media-gateway-config
  namespace: hotspot-dev
data:
  nginx.conf: |
    worker_processes auto;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;

      proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:64m max_size=4g inactive=30d use_temp_path=off;

      # Replace this upstream host to match the active object-storage origin for the environment.
      upstream hotspot_object_storage_origin {
        server replace-with-object-storage-origin:9000;
        keepalive 16;
      }

      server {
        listen 8080;
        server_name _;

        location = /healthz {
          access_log off;
          return 200 'ok';
        }

        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $proxy_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          proxy_buffering on;
          proxy_cache media_cache;
          proxy_cache_methods GET HEAD;
          proxy_cache_lock on;
          proxy_cache_valid 200 206 301 302 24h;
          proxy_ignore_headers Set-Cookie;
          proxy_hide_header Set-Cookie;
          add_header X-Cache-Status $upstream_cache_status always;

          proxy_pass http://hotspot_object_storage_origin;
        }
      }
    }
