apiVersion: v1
kind: Service
metadata:
  name: hotspot-media-gateway
  namespace: hotspot-dev
  labels:
    app.kubernetes.io/name: hotspot-media-gateway
    app.kubernetes.io/part-of: hotspot
    observability.openobserve/enabled: "true"
spec:
  selector:
    app: hotspot-media-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
