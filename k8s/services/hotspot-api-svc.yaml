apiVersion: v1
kind: Service
metadata:
  name: hotspot-api
  namespace: hotspot-dev
  labels:
    app.kubernetes.io/name: hotspot-api
    app.kubernetes.io/part-of: hotspot
    observability.openobserve/enabled: "true"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
spec:
  selector:
    app: hotspot-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
